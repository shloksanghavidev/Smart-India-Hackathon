<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSarthi — Doctor Portal Login</title>
  <script>
    if (sessionStorage.getItem('medisarthi_doc_auth') === 'true') {
      window.location.href = 'doctor.html';
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--bg-kiosk); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Header -->
  <header style="background:var(--teal-deepest); border-bottom:1px solid rgba(255,255,255,0.1); padding:12px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="display:flex; align-items:center; justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="5" width="10" height="30" rx="3" fill="#5eead4"/>
          <rect x="5" y="15" width="30" height="10" rx="3" fill="#5eead4"/>
          <circle cx="32" cy="8" r="4.5" fill="#D96C2F"/>
        </svg>
      </div>
      <div>
        <h1 style="font-size:1.2rem; font-weight:700; color:#ffffff; margin:0; line-height:1.1;">MediSarthi</h1>
        <p style="font-size:0.72rem; color:#99f6e4; margin:0; text-transform:uppercase; letter-spacing:0.4px;">Doctor Clinical Workstation</p>
      </div>
    </div>
    <div>
      <a href="index.html" class="btn-back" style="background:rgba(255,255,255,0.1); color:#ffffff; border-color:rgba(255,255,255,0.25); text-decoration:none; font-size:0.85rem;">
        <i class="fa-solid fa-hospital-user"></i> Patient OPD Kiosk
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div id="doctor-login-card" style="max-width:440px; width:100%; margin:0 auto; padding:clamp(20px, 4vw, 36px) clamp(16px, 3.5vw, 32px); background:#ffffff; border:1px solid var(--border-subtle); border-top:4px solid var(--orange-primary); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); text-align:center;">
      <div style="font-size:2.8rem; color:var(--teal-deep); margin-bottom:12px;"><i class="fa-solid fa-user-doctor"></i></div>
      <h2 style="font-size:1.75rem; font-weight:800; color:var(--teal-deepest); margin-bottom:6px;">Doctor Portal</h2>
      <p style="color:var(--text-muted); margin-bottom:22px; font-size:0.92rem;">Government Hospital Clinical Consultation Desk</p>

      <div id="login-error-msg" style="display:none; background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; padding:10px 14px; border-radius:var(--radius-xs); font-size:0.88rem; font-weight:600; margin-bottom:18px; text-align:center;"></div>

      <div class="form-group" style="text-align:left; margin-bottom:16px;">
        <label style="font-weight:700; font-size:0.9rem; color:var(--teal-deep); margin-bottom:6px; display:block;">Doctor ID</label>
        <input type="text" id="doc-login-id" class="kiosk-input" style="height:48px; min-height:48px; font-size:1rem; text-align:left; letter-spacing:normal;" placeholder="e.g. DR-MEDISARTHI" value="DR-MEDISARTHI" onkeydown="if(event.key==='Enter') App.loginDoctor()">
      </div>
      
      <div class="form-group" style="text-align:left; margin-bottom:24px;">
        <label style="font-weight:700; font-size:0.9rem; color:var(--teal-deep); margin-bottom:6px; display:block;">Password</label>
        <input type="password" id="doc-login-pass" class="kiosk-input" style="height:48px; min-height:48px; font-size:1rem; text-align:left; letter-spacing:normal;" placeholder="Enter password" value="SIH2026@Doctor" onkeydown="if(event.key==='Enter') App.loginDoctor()">
      </div>

      <button class="btn-kiosk-primary" style="font-size:1.05rem; width:100%; min-height:50px;" onclick="App.loginDoctor()">
        Doctor Login <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i>
      </button>

      <div style="margin-top:20px;">
        <a href="index.html" class="btn-help-link" style="text-decoration:none; font-size:0.88rem;"><i class="fa-solid fa-arrow-left"></i> Back to Patient Kiosk</a>
      </div>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>

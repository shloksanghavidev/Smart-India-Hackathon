<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSarthi — Doctor Portal Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#f8fafc; min-height:100vh; display:flex; flex-direction:column;">

  <!-- Header -->
  <header style="background:white; border-bottom:1px solid var(--border-color); padding:16px 32px; display:flex; align-items:center; justify-space-between;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:40px; height:40px; background:linear-gradient(135deg, var(--primary), #0284c7); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:1.2rem;">
        <i class="fa-solid fa-stethoscope"></i>
      </div>
      <div>
        <h1 style="font-size:1.25rem; font-weight:800; color:var(--text-main); margin:0;">MediSarthi</h1>
        <p style="font-size:0.78rem; color:var(--text-muted); margin:0;">Doctor Portal Access</p>
      </div>
    </div>
    <div>
      <a href="index.html" class="btn-help-link" style="text-decoration:none; color:var(--text-muted); font-size:0.9rem;">
        <i class="fa-solid fa-house-user"></i> Patient Kiosk
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div id="doctor-login-card" style="max-width:480px; width:100%; margin:0 auto; padding:40px; background:white; border-radius:var(--radius-lg); box-shadow:var(--shadow-kiosk); text-align:center;">
      <div style="font-size:3rem; color:var(--doc-primary); margin-bottom:12px;"><i class="fa-solid fa-user-doctor"></i></div>
      <h2 style="font-size:1.8rem; font-weight:800; margin-bottom:6px;" data-i18n="doctor_portal">Doctor Portal</h2>
      <p style="color:var(--text-muted); margin-bottom:24px;">MediSarthi Clinical Consultation Desk</p>
      <div class="form-group" style="text-align:left; margin-bottom:14px;">
        <label>Doctor ID / Mobile</label>
        <input type="text" id="doc-login-id" class="kiosk-input" style="height:52px; font-size:1rem; text-align:left;" value="DR_SHARMA_104">
      </div>
      <div class="form-group" style="text-align:left; margin-bottom:22px;">
        <label>Password</label>
        <input type="password" id="doc-login-pass" class="kiosk-input" style="height:52px; font-size:1rem; text-align:left;" value="password123">
      </div>
      <button class="btn-kiosk-primary" style="background:linear-gradient(135deg,#0284c7,#0369a1); font-size:1.1rem; width:100%;" onclick="App.loginDoctor()">
        Login as Dr. Sharma <i class="fa-solid fa-right-to-bracket"></i>
      </button>
      <div style="margin-top:18px;">
        <a href="index.html" class="btn-help-link" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back to Patient Kiosk</a>
      </div>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
